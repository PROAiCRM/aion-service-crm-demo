<!doctype html>

<style>

</style>

<body>
<div id="state">Открываем AION Commercial v7.2…</div>
<iframe id="app" title="AION Service CRM Commercial v7.2" src="app-v7-1.html?v=20260802-2" allow="camera; clipboard-read; clipboard-write"></iframe>
<script>
const frame=document.getElementById('app');
const state=document.getElementById('state');
const patch=`
/* AION Commercial v7.2 — Full Canon Across Tabs */
.app-shell{padding-bottom:calc(104px + env(safe-area-inset-bottom))!important}
.metric-card.revenue strong{font-size:clamp(12px,3.4vw,17px)!important;letter-spacing:-.045em!important;white-space:nowrap!important;line-height:1.05!important}
.metric-card.revenue{overflow:hidden!important}
.queue-grid{display:grid!important;grid-template-columns:none!important;grid-auto-flow:column!important;grid-auto-columns:minmax(166px,43vw)!important;gap:8px!important;overflow-x:auto!important;overflow-y:hidden!important;scroll-snap-type:x mandatory!important;padding:1px 2px 7px!important;scrollbar-width:none!important}
.queue-grid::-webkit-scrollbar{display:none!important}
.queue-card{scroll-snap-align:start!important;min-height:184px!important;grid-template-columns:48px minmax(0,1fr)!important;padding:9px!important;gap:7px!important}
.rear-phone{width:48px!important;height:94px!important}
.queue-copy strong{font-size:11px!important}.queue-copy span{font-size:9px!important}.queue-copy small{font-size:8px!important}.status{font-size:8px!important;padding:5px 5px!important}
.bottom-dock{bottom:calc(5px + env(safe-area-inset-bottom))!important;width:min(calc(100% - 14px),416px)!important;padding:4px!important;border-radius:18px!important;background:linear-gradient(180deg,rgba(8,20,39,.94),rgba(3,10,23,.97))!important;box-shadow:0 -10px 28px rgba(0,0,0,.42),inset 0 1px 0 rgba(125,173,255,.11)!important;backdrop-filter:blur(18px) saturate(140%)!important}
.nav-item{height:58px!important;border-radius:12px!important}.dock-icon{width:27px!important;height:27px!important;display:grid!important;place-items:center!important}.dock-icon svg{width:22px!important;height:22px!important;fill:none!important;stroke:currentColor!important;stroke-width:1.8!important;stroke-linecap:round!important;stroke-linejoin:round!important;filter:drop-shadow(0 3px 5px rgba(41,113,255,.38))}.nav-item b{font-size:9px!important}.nav-item.active{box-shadow:0 0 15px rgba(39,112,255,.24),inset 0 0 12px rgba(43,104,255,.12)!important}
.view[data-view="clients"] .screen-title,.view[data-view="more"] .screen-title{margin-bottom:14px!important}.view[data-view="clients"] .screen-title h1,.view[data-view="more"] .screen-title h1{font-size:29px!important;letter-spacing:-.035em!important}.view[data-view="clients"] .screen-title p,.view[data-view="more"] .screen-title p{font-size:12px!important}
.view[data-view="clients"] .search-box{min-height:58px!important;border-radius:16px!important;background:linear-gradient(145deg,var(--surface),var(--surface2))!important;box-shadow:var(--soft)!important}
.view[data-view="clients"] .list-row{min-height:82px!important;border-radius:17px!important;background:linear-gradient(145deg,var(--surface),var(--surface2))!important;box-shadow:var(--soft),inset 0 1px 0 rgba(126,171,255,.08)!important}
.view[data-view="clients"] .client-row,.view[data-view="clients"] .client-tool,.view[data-view="clients"] .quick-card,.view[data-view="clients"] .client-action,.view[data-view="more"] .more-card,.view[data-view="more"] .setting-card{border-radius:17px!important;background:radial-gradient(circle at 22% 18%,rgba(45,112,255,.13),transparent 48%),linear-gradient(145deg,var(--surface),var(--surface2))!important;border:1px solid var(--line)!important;box-shadow:var(--soft),inset 0 1px 0 rgba(126,171,255,.09)!important}
.view[data-view="clients"] .initials{box-shadow:0 8px 18px rgba(25,81,180,.24),inset 0 1px 0 rgba(255,255,255,.22)!important}
.view[data-view="more"] .more-grid,.view[data-view="more"] .settings-grid{gap:10px!important}.view[data-view="more"] .more-card,.view[data-view="more"] .setting-card{min-height:128px!important;padding:16px!important}.view[data-view="more"] .more-card b,.view[data-view="more"] .setting-card b{font-size:16px!important}.view[data-view="more"] .more-card span,.view[data-view="more"] .setting-card small{font-size:11px!important}
html[data-theme="light"]{--bg:#dce6f3!important;--bg2:#edf3fb!important;--surface:#f8fbff!important;--surface2:#e7eef8!important;--surface3:#dfe8f4!important;--line:#aebfd8!important;--line2:#4f82ca!important;--text:#101827!important;--text2:#33435d!important;--muted:#60718b!important;--shadow:0 12px 28px rgba(34,58,93,.16),inset 0 1px 0 rgba(255,255,255,.94)!important;--soft:0 7px 18px rgba(34,58,93,.13)!important}
html[data-theme="light"] body{background:radial-gradient(620px 300px at 50% -60px,rgba(38,105,220,.18),transparent 68%),linear-gradient(180deg,#f4f8fd,#dce6f3)!important}
html[data-theme="light"] .premium-panel,html[data-theme="light"] .metric-card,html[data-theme="light"] .action-card,html[data-theme="light"] .queue-card,html[data-theme="light"] .list-row,html[data-theme="light"] .more-card,html[data-theme="light"] .setting-card{background:linear-gradient(145deg,#ffffff,#e6edf7)!important;border-color:#aebfd8!important;box-shadow:0 10px 24px rgba(35,59,94,.15),inset 0 1px 0 rgba(255,255,255,.96)!important}
html[data-theme="light"] .bottom-dock{background:linear-gradient(180deg,rgba(244,248,253,.97),rgba(216,227,241,.98))!important;border-color:#9db3d2!important;box-shadow:0 -9px 27px rgba(38,61,96,.18),inset 0 1px 0 rgba(255,255,255,.96)!important}
html[data-theme="light"] .nav-item:not(.active){color:#5e6f89!important}html[data-theme="light"] .nav-item.active{color:#13213a!important;background:linear-gradient(180deg,rgba(62,126,235,.18),rgba(46,104,204,.10))!important}
@media(max-width:390px){.queue-grid{grid-auto-columns:minmax(158px,44vw)!important}.queue-card{min-height:178px!important;grid-template-columns:44px minmax(0,1fr)!important}.rear-phone{width:44px!important;height:88px!important}.bottom-dock{width:calc(100% - 10px)!important}.nav-item{height:56px!important}.metric-card.revenue strong{font-size:11px!important}}
`;
const icons={
'Главная':'<svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg>',
'Заказы':'<svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M8 9h8M8 13h8M8 17h5"/></svg>',
'Ремонт':'<svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5-5L6.8 4.2l3 3 2.9-2.9a4 4 0 0 0 2 2Z"/><path d="m9.5 7.5-7 7a2.1 2.1 0 0 0 3 3l7-7M14 13l7 7M16 11l5 5"/></svg>',
'Клиенты':'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20a6 6 0 0 1 12 0M14 15a5 5 0 0 1 7 5"/></svg>',
'Ещё':'<svg viewBox="0 0 24 24"><circle cx="7" cy="7" r="2"/><circle cx="17" cy="7" r="2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>'
};
function apply(){
  const doc=frame.contentDocument;
  if(!doc||!doc.head)return false;
  const style=doc.createElement('style');style.id='aion-v72-patch';style.textContent=patch;doc.head.appendChild(style);
  doc.title='AION Service CRM — Commercial v7.2';
  doc.querySelectorAll('.nav-item').forEach(item=>{const label=item.querySelector('b')?.textContent.trim();const host=item.querySelector('.dock-icon');if(host&&icons[label])host.innerHTML=icons[label]});
  const badge=doc.createElement('div');badge.textContent='v7.2';badge.style.cssText='position:fixed;right:8px;top:8px;z-index:9999;padding:3px 6px;border-radius:999px;background:rgba(35,105,225,.13);border:1px solid rgba(75,135,245,.26);color:#6ea7ff;font:700 8px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;pointer-events:none';doc.body.appendChild(badge);
  return true;
}
frame.addEventListener('load',()=>{
  state.style.display='none';
  let tries=0;const timer=setInterval(()=>{tries++;try{if(apply()||tries>30)clearInterval(timer)}catch(e){if(tries>30){clearInterval(timer);console.error(e)}}},120);
});
setTimeout(()=>{if(state.style.display!=='none')state.textContent='Версия загружается дольше обычного. Обновите страницу.'},8000);
</script>
</body>
</html>
