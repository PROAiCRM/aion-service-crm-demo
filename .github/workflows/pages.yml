name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize Living Operations v0.8 direct page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re

          root = Path('prototypes/living-operations-v0.8')
          parts = [
              'p01.js','p02_1.js','p02_2.js','p02_3.js','p03.js','p04.js','p05.js','p06.js','p07.js','p08.js',
              'p09a.js','p09b.js','p10a.js','p10b.js','p10c.js'
          ]
          payload = ''
          pattern = re.compile(r"^window\.__aionV08Payload=\(window\.__aionV08Payload\|\|''\)\+'([A-Za-z0-9+/=]+)';\s*$")
          for name in parts:
              text = (root / name).read_text(encoding='utf-8')
              match = pattern.match(text)
              if not match:
                  raise SystemExit(f'Invalid v0.8 payload part: {name}')
              payload += match.group(1)

          raw = base64.b64decode(payload, validate=True)
          expected_source_bytes = 74279
          if len(raw) != expected_source_bytes:
              raise SystemExit(f'v0.8 payload byte mismatch: {len(raw)} != {expected_source_bytes}')
          html = raw.decode('utf-8')

          def replace_once(old, new, label):
              global html
              if html.count(old) != 1:
                  raise SystemExit(f'v0.8 patch target {label}: expected 1, got {html.count(old)}')
              html = html.replace(old, new, 1)

          replace_once(
              "set:(k,v)=>{try{storage.set(k,v)}catch(e){}}",
              "set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}",
              'localStorage set'
          )
          replace_once(
              "const tool=e.target.closest('[data-tool]');if(tool){navigate(tool.dataset.tool);return}const g=e.target.closest('[data-go]');if(g){e.preventDefault();navigate(g.dataset.go);return}const cap=e.target.closest('[data-capture]');if(cap){e.preventDefault();e.stopPropagation();navigate('capture',{params:{mode:cap.dataset.capture}});return}",
              "const tool=e.target.closest('[data-tool]');if(tool){navigate(tool.dataset.tool);return}const cap=e.target.closest('[data-capture]');if(cap){e.preventDefault();e.stopPropagation();navigate('capture',{params:{mode:cap.dataset.capture}});return}const g=e.target.closest('[data-go]');if(g){e.preventDefault();navigate(g.dataset.go);return}",
              'capture routing'
          )
          replace_once(
              "settingsBar.addEventListener('click',e=>{const b=e.target.closest('[data-set]');if(!b)return;const a=b.dataset.set;",
              "settingsBar.addEventListener('click',e=>{const b=e.target.closest('[data-set]');if(!b)return;e.preventDefault();e.stopPropagation();const a=b.dataset.set;",
              'settings event'
          )
          replace_once(
              "panelPrimary.addEventListener('click',()=>{if(panelPrimary.disabled)return;if(panelPrimary.dataset.action)act(panelPrimary.dataset.action);else if(panelPrimary.dataset.go)navigate(panelPrimary.dataset.go)});",
              "panelPrimary.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(panelPrimary.disabled)return;if(panelPrimary.dataset.action)act(panelPrimary.dataset.action);else if(panelPrimary.dataset.go)navigate(panelPrimary.dataset.go)});",
              'next primary event'
          )
          replace_once(
              "panelSecondary.addEventListener('click',()=>{if(panelSecondary.dataset.secondary==='Документы')navigate('documents');if(panelSecondary.dataset.secondary==='Есть проблема'){state.order.otkProblem=true;rerender('otk')}});",
              "panelSecondary.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(panelSecondary.dataset.secondary==='Документы')navigate('documents');if(panelSecondary.dataset.secondary==='Есть проблема'){state.order.otkProblem=true;rerender('otk')}});",
              'next secondary event'
          )

          anchor = "document.addEventListener('click',e=>{const why="
          if '__orderScreenV08' not in html:
              if anchor not in html:
                  raise SystemExit('v0.8 Start Anywhere anchor missing')
              patch = '''// v0.8 Start Anywhere completion: secondary repair starts from existing operational context.\nconst __orderScreenV08=screens.order;\nscreens.order=()=>__orderScreenV08().replace('data-go="device">Устройство</button></div></section>','data-go="device">Устройство</button><button class="small-btn ghost" data-new="order">Новый ремонт</button></div></section>');\nconst __documentsScreenV08=screens.documents;\nscreens.documents=()=>__documentsScreenV08()+`<button class="small-btn ghost context-new" data-new="order">Новый ремонт из контекста заказа</button>`;\nconst __historyScreenV08=screens.history;\nscreens.history=()=>__historyScreenV08()+`<button class="small-btn ghost context-new" data-new="order">Новый ремонт из истории</button>`;\n'''
              html = html.replace(anchor, patch + anchor, 1)

          required = [
              'Требует внимания','Новый ремонт','Найти что угодно','Контроль качества','ОТК','My Workspace',
              'Следующее действие','authoritative reread','Долг — исключение'
          ]
          missing = [x for x in required if x not in html]
          if missing:
              raise SystemExit('v0.8 required contract missing: ' + ', '.join(missing))

          patched_bytes = len(html.encode('utf-8'))
          if patched_bytes < expected_source_bytes:
              raise SystemExit(f'v0.8 patched page unexpectedly shrank: {patched_bytes}')

          (root / 'index.html').write_text(html, encoding='utf-8')
          script = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if len(script) != 1:
              raise SystemExit(f'Expected one inline script in materialized v0.8, got {len(script)}')
          Path('/tmp/aion-v08.js').write_text(script[0], encoding='utf-8')
          print(f'v0.8 direct materialized: {patched_bytes} bytes; source payload: {len(raw)} bytes')
          PY
          node --check /tmp/aion-v08.js
          grep -q "Требует внимания" prototypes/living-operations-v0.8/index.html
          grep -q "Контроль качества" prototypes/living-operations-v0.8/index.html
          grep -q "Найти что угодно" prototypes/living-operations-v0.8/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
