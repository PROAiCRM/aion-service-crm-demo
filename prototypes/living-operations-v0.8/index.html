document.addEventListener('click',e=>{const close=e.target.closest('[data-b02-close]');if(close){e.preventDefault();e.stopImmediatePropagation();closeSheet();return}const sd=e.target.closest('[data-b02-doc]');if(sd){e.preventDefault();e.stopImmediatePropagation();showToast(sd.dataset.b02Doc==='print'?'Печать доступна в capability-режиме':'Документ подготовлен к скачиванию');return}const set=e.target.closest('[data-set]');if(set){e.preventDefault();e.stopImmediatePropagation();const a=set.dataset.set;if(a==='minus')applyScale(scaleIndex-1);if(a==='plus')applyScale(scaleIndex+1);if(a==='reset')applyScale(2);if(a==='theme'){app.classList.toggle('light');storage.set('aion-v08-theme',app.classList.contains('light')?'light':'dark')}if(a==='workspace'){settingsBar.classList.remove('open');navigate('settings')}if(a==='account'){settingsBar.classList.remove('open');openSheet('<div class="sheet-kicker-b02">Аккаунт</div><h3>Иван</h3><p>Сотрудник / Мастер</p><button class="small-btn" data-auth="logout">Выйти</button>')}return}const w=e.target.closest('[data-why]');if(w){e.preventDefault();e.stopImmediatePropagation();why('attention');return}const p=e.target.closest('[data-proof]');if(p){e.preventDefault();e.stopImmediatePropagation();why('proof');return}const d=e.target.closest('[data-debt]');if(d){e.preventDefault();e.stopImmediatePropagation();openSheet('<div class="sheet-kicker-b02">Исключение</div><h3>Выдача в долг</h3><p><b>Это НЕ оплата.</b> Требуется отдельное разрешение и evidence.</p><div class="sheet-next-b02">Обычный путь: принять оплату</div>');return}const row=e.target.closest('.doc');if(row&&!e.target.closest('[data-doc="download"],[data-doc="print"]')){e.preventDefault();e.stopImmediatePropagation();openDoc(row);return}const pin=e.target.closest('[data-pin]');if(pin){e.preventDefault();e.stopImmediatePropagation();const id=pin.dataset.pin,was=state.pinned.includes(id);state.pinned=was?state.pinned.filter(x=>x!==id):[...state.pinned,id].slice(-4);savePinned();showToast(was?'Убрано с Главной':'Добавлено на Главную');return}},true);
