<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030713">
<title>AION Service CRM — Comfort v6.1</title>
<style>
html,body{margin:0;min-height:100%;background:#030713;color:#f5f7ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:grid;place-items:center}.loading{opacity:.78;text-align:center;padding:24px}.error{color:#ff9ca9;max-width:340px;line-height:1.45}
</style>
</head>
<body><div class="loading" id="loading">Открываем AION Service CRM Comfort v6.1…</div>
<script>
const hotfix=`
/* Comfort v6.1 — iPhone layout hotfix */
.action-row{grid-template-columns:minmax(0,1fr) 104px!important}
.new-repair{display:grid!important;grid-template-columns:60px minmax(0,1fr) 21px!important;gap:12px!important;overflow:hidden!important}
.new-repair>div:nth-child(2){min-width:0!important;overflow:hidden!important}
.new-repair b{font-size:17px!important;white-space:normal!important;overflow-wrap:anywhere!important}
.new-repair small{white-space:normal!important}
.new-repair .arrow{margin-left:0!important;justify-self:end!important}
.quick-stack,.quick-action,.quick-action span{min-width:0!important}
.quick-action svg{flex:none!important}
.quick-action b,.quick-action small{white-space:nowrap!important}
.order-head{display:grid!important;grid-template-columns:1fr!important;align-items:start!important;gap:5px!important;min-height:43px!important}
.order-id{white-space:nowrap!important}
.tag{justify-self:start!important;max-width:100%!important;padding:4px 7px!important;border-radius:7px!important;font-size:8px!important;font-weight:700!important;line-height:1.15!important;white-space:nowrap!important}
html[data-theme="light"] .tag{background:#dce8ff!important;border:1px solid #bed2ff!important;color:#245eb7!important}
html[data-theme="light"] .tag.green{background:#dcf7eb!important;border-color:#b9ead5!important;color:#16764f!important}
@media(max-width:390px){.action-row{grid-template-columns:minmax(0,1fr) 96px!important}.new-repair{grid-template-columns:56px minmax(0,1fr) 18px!important;gap:10px!important;padding:10px!important}.plusbox{width:56px!important;height:56px!important}.new-repair b{font-size:16px!important}.quick-action{padding:7px!important}.orders-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important}}
`;
(async()=>{
  try{
    const response=await fetch('app-v6.html?v=20260801-4',{cache:'no-store'});
    if(!response.ok)throw new Error('HTTP '+response.status);
    let html=await response.text();
    html=html.replace('<title>AION Service CRM — Comfort v6</title>','<title>AION Service CRM — Comfort v6.1</title>');
    html=html.replace('</head>',`<style>${hotfix}</style></head>`);
    html=html.replace('РАБОЧАЯ ЗОНА','РАБОЧАЯ ЗОНА · v6.1');
    document.open();document.write(html);document.close();
  }catch(error){
    document.getElementById('loading').className='loading error';
    document.getElementById('loading').textContent='Не удалось открыть v6.1. Обновите страницу или откройте ссылку ещё раз.';
    console.error(error);
  }
})();
</script>
</body>
</html>
